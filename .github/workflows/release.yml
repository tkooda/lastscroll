name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.LASTSCROLL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LASTSCROLL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LASTSCROLL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LASTSCROLL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          apk=$(ls app/build/outputs/apk/release/lastscroll-*-release.apk)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Upload APK (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
